[project]
name = "grafo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "juvenalculino", email = "b831381@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<47",
    "fastapi>=0.162.0",
    "networkx>=3.6.1",
    "openpyxl>=3.1.0",
